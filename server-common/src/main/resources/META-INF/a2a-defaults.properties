# A2A SDK Default Configuration Values
# These values are used when no other configuration source provides them

# DefaultRequestHandler - Blocking call timeouts
# Timeout for agent execution to complete (seconds)
# Increase for slow agents: LLM-based, data processing, external APIs
a2a.blocking.agent.timeout.seconds=30

# Timeout for event consumption/persistence to complete (seconds)
# Ensures TaskStore is fully updated before returning to client
a2a.blocking.consumption.timeout.seconds=5

# Timeout for TaskStore reconciliation polling in blocking calls (seconds)
# When in-memory event capture is empty, polls TaskStore with this bounded timeout
a2a.blocking.reconciliation.timeout.seconds=1

# AsyncExecutorProducer - Thread pool configuration
# Core pool size for async agent execution
a2a.executor.core-pool-size=5

# Maximum pool size for async agent execution
a2a.executor.max-pool-size=50

# Keep-alive time for idle threads (seconds)
a2a.executor.keep-alive-seconds=60

# Queue capacity for pending tasks (must be bounded to enable pool growth)
# When queue is full, new threads are created up to max-pool-size
a2a.executor.queue-capacity=100

# SimpleRequestContextBuilder - Referenced task population
# When true, referenced task IDs in messages are resolved from the TaskStore
# and made available via RequestContext.getRelatedTasks()
a2a.request-context.populate-referred-tasks=true

# PushNotificationConfigStore - per-task configuration limit
# Maximum number of push notification configs a single task may register.
# Prevents a task from accumulating an unbounded list of configs (each config
# consumes memory and can trigger outbound HTTP requests).
a2a.push-notification-config.max-per-task=100


# DefaultRequestHandler - Authorization enforcement
# When true (default), all operations are denied if no TaskAuthorizationProvider
# is configured (fail-closed). Set to false to allow unauthenticated access
# (fail-open), e.g. for single-user deployments or testing.
a2a.authorization.required=true

# Push notifications - global enablement
# When true, push notification configs in sendMessage requests are accepted
# and stored. When false, they are silently ignored and direct
# CreateTaskPushNotificationConfig calls return UnsupportedOperationError.
a2a.push-notification.enabled=true

# PushNotificationUrlValidator - SSRF protection for push notification URLs
# Comma-separated list of allowed URL schemes (case-insensitive).
a2a.push-notification.url.allowed-schemes=https
# When true, allows push notification URLs targeting private/internal network
# addresses (loopback, link-local, site-local, cloud metadata). Defaults to
# false to prevent SSRF. Set to true ONLY in trusted development environments.
a2a.push-notification.url.allow-private-network-targets=false
# TTL in seconds for DNS resolution caching during URL validation.
# Avoids a blocking DNS lookup on every push notification. Set to 0 to disable.
a2a.push-notification.url.dns-cache-ttl-seconds=30
