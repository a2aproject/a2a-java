name: Build and Test

on:
  # Only run for the 0.3.x maintenance branch
  push:
    branches:
      - 0.3.x
  pull_request:
    branches:
      - 0.3.x
  workflow_dispatch:

# Only run the latest job
concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['17', '21', '25']
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven and run tests
      # The replication integration tests boot Quarkus Dev Services (Redpanda via
      # Testcontainers). On current runners (Docker 29.x) the Testcontainers client of
      # the Quarkus 3.28.x stack cannot detect the Docker daemon, so skip them here;
      # they still run locally and on the newer stack used by main.
      run: mvn -B package --file pom.xml -fae -DskipDockerTests=true
    - name: Upload Test Reports
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: surefire-reports-java-${{ matrix.java-version }}
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/
        retention-days: 7
        if-no-files-found: warn
    - name: Upload Build Logs
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: build-logs-java-${{ matrix.java-version }}
        path: |
          **/target/*.log
          **/target/quarkus.log
        retention-days: 3
        if-no-files-found: ignore
