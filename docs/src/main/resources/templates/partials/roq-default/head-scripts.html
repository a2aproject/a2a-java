<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: 'neutral' });

{#ga4 tag=site.data.getJsonObject('analytics').getString("ga4", "") /}
{/if}

<script>
(function () {
    document.addEventListener('DOMContentLoaded', function () {
        var dropdown = document.querySelector('.version-dropdown');
        var toggle = document.querySelector('.version-dropdown-toggle');
        var dropdownMenu = document.querySelector('.version-dropdown-menu');
        if (!toggle || !dropdownMenu || !dropdown) return;

        var dataEl = document.getElementById('version-data');
        var versions = [];
        if (dataEl) {
            try { versions = JSON.parse(dataEl.textContent); } catch (e) { return; }
        }
        if (!versions.length) return;

        versions.sort(function (a, b) { return b.sortOrder - a.sortOrder; });

        var defaultVersion = versions.find(function (v) { return v.defaultVersion; }) || versions[0];

        var basePath = dropdown.dataset.baseUrl || '/';
        if (basePath.charAt(basePath.length - 1) !== '/') basePath += '/';

        // Detect current version from URL
        var currentPath = window.location.pathname;
        var relPath = currentPath.startsWith(basePath) ? currentPath.substring(basePath.length) : currentPath.substring(1);
        var segments = relPath.split('/').filter(Boolean);
        var firstSegment = segments[0] || '';

        // "latest" in URL maps to the default version
        var effectiveSegment = (firstSegment === 'latest') ? defaultVersion.path : firstSegment;

        var currentVersion = versions.find(function (v) { return v.path === effectiveSegment; }) || defaultVersion;

        var isVersionedPage = versions.some(function (v) { return v.path === effectiveSegment; }) || firstSegment === 'latest';
        var pagePath = isVersionedPage ? '/' + segments.slice(1).join('/') : '';

        // Update dropdown label
        var label = toggle.querySelector('.version-dropdown-label');
        if (label) label.textContent = currentVersion.label;

        // Sort dropdown items
        var items = Array.from(dropdownMenu.querySelectorAll('li'));
        var byPath = {};
        items.forEach(function (li) { byPath[li.dataset.versionPath] = li; });
        versions.forEach(function (v) {
            if (byPath[v.path]) dropdownMenu.appendChild(byPath[v.path]);
        });

        // Rebuild versioned menu if current version differs from the SSR default
        var menuContainer = document.querySelector('.version-menu-items');
        if (menuContainer && (currentVersion.path !== defaultVersion.path || firstSegment === 'latest')) {
            menuContainer.innerHTML = '';
            currentVersion.menu.forEach(function (item) {
                var li = document.createElement('li');
                var a = document.createElement('a');
                a.href = basePath + currentVersion.path + item.path;
                if (item.target) { a.target = item.target; }
                var icon = document.createElement('i');
                icon.className = item.icon;
                a.appendChild(icon);
                a.appendChild(document.createTextNode(item.title));
                li.appendChild(a);
                menuContainer.appendChild(li);
            });
        }

        // Show dev banner on /dev/ pages
        var devBanner = document.querySelector('.dev-banner');
        if (devBanner && currentVersion.devVersion) {
            devBanner.style.display = '';
            var bannerLink = devBanner.querySelector('.dev-banner-link');
            if (bannerLink) {
                bannerLink.href = basePath + defaultVersion.path + (pagePath || '/getting-started');
            }
        }

        // Toggle dropdown
        toggle.addEventListener('click', function (e) {
            e.stopPropagation();
            var expanded = dropdownMenu.classList.toggle('version-dropdown-open');
            toggle.setAttribute('aria-expanded', expanded);
        });

        document.addEventListener('click', function () {
            dropdownMenu.classList.remove('version-dropdown-open');
            toggle.setAttribute('aria-expanded', 'false');
        });

        // Version-scoped search filter
        var searchField = document.getElementById('search-field');
        var searchResults = document.getElementById('search-results');
        if (searchField && searchResults) {
            var toggleDiv = document.createElement('div');
            toggleDiv.className = 'search-version-toggle';
            var checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = 'search-version-filter';
            checkbox.checked = isVersionedPage;
            var toggleLabel = document.createElement('label');
            toggleLabel.htmlFor = 'search-version-filter';
            toggleLabel.textContent = 'Current version only';
            toggleDiv.appendChild(checkbox);
            toggleDiv.appendChild(toggleLabel);
            toggleDiv.addEventListener('click', function (e) { e.stopPropagation(); });
            searchField.parentNode.insertBefore(toggleDiv, searchField.nextSibling);

            var versionPathnamePrefix = new URL(basePath + currentVersion.path + '/', window.location.origin).pathname;
            var allVersionPrefixes = versions.map(function (v) {
                return new URL(basePath + v.path + '/', window.location.origin).pathname;
            });

            function isVersionedPath(pathname) {
                return allVersionPrefixes.some(function (p) { return pathname.indexOf(p) === 0; });
            }

            function filterSearchResults() {
                var checked = checkbox.checked;
                searchResults.querySelectorAll('a.search-result-item').forEach(function (a) {
                    if (!a.href) return;
                    try {
                        var pathname = new URL(a.href).pathname;
                        var show = !checked || pathname.indexOf(versionPathnamePrefix) === 0 || !isVersionedPath(pathname);
                        a.style.display = show ? '' : 'none';
                    } catch (e) {
                        a.style.display = !checked ? '' : 'none';
                    }
                });
            }

            checkbox.addEventListener('change', filterSearchResults);

            var observer = new MutationObserver(filterSearchResults);
            observer.observe(searchResults, { childList: true });
            window.addEventListener('pagehide', function () { observer.disconnect(); });
        }

        // Version switch
        dropdownMenu.addEventListener('click', function (e) {
            var li = e.target.closest('li[data-version-path]');
            if (!li) return;
            var targetPath = li.dataset.versionPath;
            var targetVersion = versions.find(function (v) { return v.path === targetPath; });
            if (!targetVersion) return;

            var menuPaths = targetVersion.menu.map(function (m) { return m.path; });
            var topLevelPath = pagePath ? '/' + pagePath.split('/').filter(Boolean)[0] : '';
            var targetPageExists = pagePath && (menuPaths.indexOf(pagePath) !== -1 || menuPaths.indexOf(topLevelPath) !== -1);
            var newPagePath = targetPageExists ? pagePath : menuPaths[0];
            window.location.href = basePath + targetPath + newPagePath;
        });
    });
})();
</script>
