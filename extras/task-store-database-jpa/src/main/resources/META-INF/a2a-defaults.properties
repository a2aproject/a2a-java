# A2A JPA Database Task Store Default Configuration

# Grace period for task finalization in replicated scenarios (seconds)
# After a task reaches a final state, this is the minimum time to wait before cleanup
# to allow replicated events to arrive and be processed
a2a.replication.grace-period-seconds=15
# Maximum candidate rows inspected while counting an authorized task listing. The count must be
# exact, so listings that exceed this limit fail rather than returning a partial total. The value
# must be greater than zero.
a2a.max-scanned-tasks=10000
# Number of candidate rows fetched per query while filling an authorized task-list page.
# The value must be greater than zero.
a2a.authorization-scan-batch-size=100
